name: needyHelp_1.0
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node JS version 20.13.1
        uses: actions/setup-node@v4
        with: 
          node-version: '20.13.1'
      - run: npm install
      - run: npm run build --prefix needyhelp-ui